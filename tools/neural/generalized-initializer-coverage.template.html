<div id="generalized-initializer-coverage" class="generalized-coverage">
  <style>
    #generalized-initializer-coverage {
      position: relative;
      width: 100%;
      color: var(--foreground);
    }
    #generalized-initializer-coverage h3 {
      font-weight: 500;
      margin: 0 0 12px;
    }
    #generalized-initializer-coverage .coverage-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 24px;
      margin-bottom: 8px;
    }
    #generalized-initializer-coverage .coverage-legend-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--foreground);
      font: inherit;
      font-weight: 400;
      cursor: pointer;
    }
    #generalized-initializer-coverage .coverage-legend-button[aria-pressed="false"] .coverage-legend-symbol {
      opacity: 0.3;
    }
    #generalized-initializer-coverage .coverage-panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    #generalized-initializer-coverage .coverage-panel {
      min-width: 0;
    }
    #generalized-initializer-coverage .coverage-chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #generalized-initializer-coverage .coverage-chart text {
      fill: var(--foreground);
      font-size: 12px;
      font-weight: 400;
    }
    #generalized-initializer-coverage .coverage-chart .domain,
    #generalized-initializer-coverage .coverage-chart .tick line {
      stroke: var(--border);
    }
    #generalized-initializer-coverage .coverage-tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      max-width: calc(100% - 20px);
      padding: 8px 12px;
      color: var(--popover-foreground);
      background: var(--popover);
      border: 1px solid var(--border);
    }
    #generalized-initializer-coverage .coverage-tooltip[hidden] {
      display: none;
    }
    #generalized-initializer-coverage .coverage-tooltip-heading {
      font-weight: 500;
      margin-bottom: 4px;
    }
    #generalized-initializer-coverage .coverage-tooltip-row {
      margin-top: 6px;
    }
    #generalized-initializer-coverage .coverage-tooltip-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #generalized-initializer-coverage .coverage-tooltip-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
    }
    #generalized-initializer-coverage .coverage-tooltip-detail {
      margin-top: 2px;
    }
    @media (max-width: 700px) {
      #generalized-initializer-coverage .coverage-panels {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    @media (pointer: coarse) {
      #generalized-initializer-coverage .coverage-legend-button {
        min-height: 44px;
      }
    }
  </style>
  <h3>Held-out equilibrium qualification</h3>
  <div class="coverage-legend" aria-label="Initializer series"></div>
  <div class="coverage-panels">
    <div class="coverage-panel" data-panel="stages"></div>
    <div class="coverage-panel" data-panel="pumparounds"></div>
  </div>
  <div class="coverage-tooltip tooltip tabular-nums" role="tooltip" hidden></div>
  <div class="coverage-accessible sr-only"></div>
  <script type="application/json" id="generalized-initializer-coverage-data">@@GENERALIZED_COVERAGE_DATA@@</script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById("generalized-initializer-coverage");
      const data = JSON.parse(document.getElementById("generalized-initializer-coverage-data").textContent);
      const tooltip = root.querySelector(".coverage-tooltip");
      const visible = new Map(data.series.map(series => [series.key, true]));
      let pinnedPanel = null;
      let redrawQueued = false;
      const tooltipState = { panel: null, x: null, clientX: null, clientY: null };
      const formatPercent = value => `${d3.format(".1f")(value)}%`;
      const percent = (point, key) => 100 * point[key].qualified / point.n;
      const allRates = data.panels.flatMap(panel => panel.points.flatMap(point => data.series.map(series => percent(point, series.key))));
      const sharedExtent = d3.extent([...allRates, 0, 100]);
      const sharedPadding = Math.max(1, (sharedExtent[1] - sharedExtent[0]) * 0.04);
      const sharedYDomain = [sharedExtent[0] - sharedPadding, sharedExtent[1] + sharedPadding];

      const legend = d3.select(root.querySelector(".coverage-legend"));
      const buttons = legend.selectAll("button").data(data.series).join("button")
        .attr("type", "button")
        .attr("class", "coverage-legend-button")
        .attr("aria-pressed", "true")
        .attr("aria-label", series => `Show ${series.label}`);
      buttons.each(function(series) {
        const button = d3.select(this);
        const swatch = button.append("svg").attr("class", "coverage-legend-symbol")
          .attr("width", 30).attr("height", 14).attr("viewBox", "0 0 30 14").attr("aria-hidden", "true");
        swatch.append("line").attr("x1", 0).attr("x2", 30).attr("y1", 7).attr("y2", 7)
          .attr("stroke", series.color).attr("stroke-width", 2)
          .attr("stroke-dasharray", series.shape === "square" ? "5 3" : null);
        if (series.shape === "square") {
          swatch.append("rect").attr("x", 12).attr("y", 4).attr("width", 6).attr("height", 6).attr("fill", series.color);
        } else {
          swatch.append("circle").attr("cx", 15).attr("cy", 7).attr("r", 3).attr("fill", series.color);
        }
        button.append("span").text(series.label);
      });
      buttons.on("click", function(event, series) {
        visible.set(series.key, !visible.get(series.key));
        d3.select(this).attr("aria-pressed", String(visible.get(series.key)));
        drawAll();
      });

      const accessible = d3.select(root.querySelector(".coverage-accessible"));
      data.panels.forEach(panel => {
        const table = accessible.append("table");
        table.append("caption").text(`${panel.xLabel}; qualified native solutions among every original held-out test input`);
        const header = table.append("thead").append("tr");
        [panel.xLabel, "Test inputs", ...data.series.flatMap(series => [`${series.label}: qualified`, `${series.label}: native advisories`])]
          .forEach(label => header.append("th").attr("scope", "col").text(label));
        const body = table.append("tbody");
        panel.points.forEach(point => {
          const row = body.append("tr");
          row.append("th").attr("scope", "row").text(point.x);
          row.append("td").text(point.n);
          data.series.forEach(series => {
            row.append("td").text(`${point[series.key].qualified}/${point.n}`);
            row.append("td").text(point[series.key].advisories);
          });
        });
      });

      function tickValues(points, width) {
        const target = width <= 420 ? 4 : Math.min(points.length, Math.floor((width - 90) / 52));
        if (points.length <= target) return points.map(point => point.x);
        return [...new Set(d3.range(target).map(index => points[Math.round(index * (points.length - 1) / (target - 1))].x))];
      }

      function measureAndDeclutter(svg, width, height) {
        const labels = [...svg.node().querySelectorAll(".tick text, text.axis-title, text.value-label")];
        const svgRect = svg.node().getBoundingClientRect();
        let previous = null;
        for (const label of labels.filter(node => node.closest(".coverage-x-axis"))) {
          let box = label.getBoundingClientRect();
          if (box.left < svgRect.left + 4) label.setAttribute("text-anchor", "start");
          if (box.right > svgRect.right - 4) label.setAttribute("text-anchor", "end");
          box = label.getBoundingClientRect();
          if (previous && box.left < previous.right + 4) {
            label.parentNode.remove();
          } else {
            previous = box;
          }
        }
        const measured = labels.filter(node => node.isConnected).map(node => ({ node, box: node.getBoundingClientRect() }));
        for (const label of measured.filter(entry => entry.node.classList.contains("value-label"))) {
          if (measured.some(other => other.node !== label.node &&
              label.box.left < other.box.right + 4 && label.box.right + 4 > other.box.left &&
              label.box.top < other.box.bottom + 4 && label.box.bottom + 4 > other.box.top)) {
            label.node.remove();
          }
        }
        svg.attr("data-label-bounds-checked", `${Math.round(width)}x${Math.round(height)}`);
      }

      function interpolated(points, key, x) {
        const nearest = d3.bisector(point => point.x).center(points, x);
        let low = points[nearest], high = low;
        if (x < low.x && nearest > 0) low = points[nearest - 1];
        if (x > high.x && nearest + 1 < points.length) high = points[nearest + 1];
        const fraction = high.x === low.x ? 0 : (x - low.x) / (high.x - low.x);
        return percent(low, key) + fraction * (percent(high, key) - percent(low, key));
      }

      function clearHover() {
        d3.select(root).selectAll("[data-chart-hover-guide], [data-chart-hover-marker]").attr("display", "none");
        tooltip.hidden = true;
        tooltipState.panel = null;
      }

      function drawPanel(panel) {
        const container = root.querySelector(`[data-panel="${panel.key}"]`);
        const width = container.getBoundingClientRect().width;
        if (!(width > 0)) return;
        const height = 310;
        const margin = { left: 72, right: 16, top: 18, bottom: 64 };
        const left = margin.left, right = width - margin.right, top = margin.top, bottom = height - margin.bottom;
        const frameWidth = right - left, frameHeight = bottom - top;
        const xExtent = d3.extent(panel.points, point => point.x);
        const xSpan = xExtent[1] - xExtent[0];
        const xPadding = Math.max(xSpan * 0.055, 0.22);
        const xScale = d3.scaleLinear().domain([xExtent[0] - xPadding, xExtent[1] + xPadding]).range([left + 4, right - 4]);
        const yScale = d3.scaleLinear().domain(sharedYDomain).range([bottom - 4, top + 4]);
        const svg = d3.select(container).selectAll("svg.coverage-chart").data([panel]).join("svg")
          .attr("class", "coverage-chart").attr("width", width).attr("height", height)
          .attr("viewBox", `0 0 ${width} ${height}`).attr("role", "img")
          .attr("aria-label", `${panel.xLabel}: strictly qualified solutions divided by all held-out inputs; Current initializer and New LNN`);
        svg.selectAll("*").remove();
        svg.append("title").text(`${panel.xLabel}: held-out equilibrium qualification`);
        svg.append("desc").text(`All ${data.testCases} original test inputs are counted, including numerical failures and native advisories. Exact numerators and sample counts are available in the accessible table and cross-series detail.`);
        const clipId = `generalized-coverage-clip-${panel.key}`;
        svg.append("defs").append("clipPath").attr("id", clipId).append("rect")
          .attr("x", left).attr("y", top).attr("width", frameWidth).attr("height", frameHeight);
        svg.append("rect").attr("data-chart-frame", "").attr("x", left).attr("y", top)
          .attr("width", frameWidth).attr("height", frameHeight).attr("fill", "none")
          .attr("stroke", "var(--border)").attr("stroke-width", 1);
        const yTicks = d3.ticks(sharedExtent[0], sharedExtent[1], 4);
        svg.append("g").selectAll("line").data(yTicks).join("line")
          .attr("x1", left).attr("x2", right).attr("y1", value => yScale(value)).attr("y2", value => yScale(value))
          .attr("stroke", "var(--border)").attr("stroke-width", 1).attr("opacity", 0.5);
        svg.append("g").attr("class", "coverage-x-axis").attr("transform", `translate(0,${bottom})`)
          .call(d3.axisBottom(xScale).tickValues(tickValues(panel.points, width)).tickFormat(d3.format("d")).tickSizeOuter(0).tickPadding(8))
          .select(".domain").remove();
        svg.append("g").attr("class", "coverage-y-axis").attr("transform", `translate(${left},0)`)
          .call(d3.axisLeft(yScale).tickValues(yTicks).tickFormat(value => `${value}%`).tickSizeOuter(0).tickPadding(8))
          .select(".domain").remove();
        svg.append("text").attr("class", "axis-title").attr("data-axis", "x")
          .attr("x", (left + right) / 2).attr("y", height - 12).attr("text-anchor", "middle").text(panel.xLabel);
        svg.append("text").attr("class", "axis-title").attr("data-axis", "y")
          .attr("transform", `translate(16,${(top + bottom) / 2}) rotate(-90)`)
          .attr("text-anchor", "middle").text("Qualified cases (%)");
        const marks = svg.append("g").attr("clip-path", `url(#${clipId})`);
        data.series.filter(series => visible.get(series.key)).forEach(series => {
          const group = marks.append("g").attr("data-series", series.key);
          group.append("path").datum(panel.points)
            .attr("d", d3.line().x(point => xScale(point.x)).y(point => yScale(percent(point, series.key))))
            .attr("fill", "none").attr("stroke", series.color).attr("stroke-width", 2)
            .attr("stroke-dasharray", series.shape === "square" ? "5 3" : null);
          if (series.shape === "square") {
            group.selectAll("rect").data(panel.points).join("rect")
              .attr("x", point => xScale(point.x) - 3.5).attr("y", point => yScale(percent(point, series.key)) - 3.5)
              .attr("width", 7).attr("height", 7).attr("fill", series.color);
          } else {
            group.selectAll("circle").data(panel.points).join("circle")
              .attr("cx", point => xScale(point.x)).attr("cy", point => yScale(percent(point, series.key)))
              .attr("r", 3.5).attr("fill", series.color);
          }
        });
        const guide = marks.append("line").attr("data-chart-hover-guide", "").attr("y1", top).attr("y2", bottom)
          .attr("stroke", "var(--foreground)").attr("stroke-width", 1).attr("opacity", 0.55).attr("display", "none");
        const hoverMarkers = marks.append("g");
        data.series.forEach(series => {
          const marker = hoverMarkers.append(series.shape === "square" ? "rect" : "circle")
            .attr("data-chart-hover-marker", series.key).attr("fill", series.color).attr("display", "none");
          if (series.shape === "square") marker.attr("width", 8).attr("height", 8);
          else marker.attr("r", 4);
        });
        const hit = svg.append("rect").attr("data-chart-hit", "").attr("data-chart-hover-overlay", "cross-series")
          .attr("x", left).attr("y", top).attr("width", frameWidth).attr("height", frameHeight)
          .attr("fill", "transparent").attr("pointer-events", "all");

        function showAt(event, localX) {
          const x = xScale.invert(localX);
          if (x < xExtent[0] || x > xExtent[1]) {
            if (!pinnedPanel) clearHover();
            return;
          }
          const nearestIndex = d3.bisector(point => point.x).center(panel.points, x);
          const nearest = panel.points[nearestIndex];
          d3.select(root).selectAll("[data-chart-hover-guide], [data-chart-hover-marker]").attr("display", "none");
          guide.attr("x1", localX).attr("x2", localX).attr("display", null);
          tooltip.replaceChildren();
          const heading = document.createElement("div");
          heading.className = "coverage-tooltip-heading";
          heading.textContent = `${panel.sampleLabel}: ${d3.format(".1f")(x)} · interpolated`;
          tooltip.appendChild(heading);
          const sample = document.createElement("div");
          sample.className = "text-small";
          sample.textContent = `Nearest sample: ${nearest.x}; n = ${nearest.n}`;
          tooltip.appendChild(sample);
          data.series.filter(series => visible.get(series.key)).forEach(series => {
            const y = interpolated(panel.points, series.key, x);
            const marker = hoverMarkers.select(`[data-chart-hover-marker="${series.key}"]`).attr("display", null);
            if (series.shape === "square") marker.attr("x", localX - 4).attr("y", yScale(y) - 4);
            else marker.attr("cx", localX).attr("cy", yScale(y));
            const row = document.createElement("div");
            row.className = "coverage-tooltip-row";
            const label = document.createElement("div");
            label.className = "coverage-tooltip-label";
            const swatch = document.createElement("span");
            swatch.className = "coverage-tooltip-swatch";
            swatch.style.background = series.color;
            if (series.shape === "circle") swatch.style.borderRadius = "50%";
            label.appendChild(swatch);
            label.appendChild(document.createTextNode(`${series.label}: ${formatPercent(y)}`));
            const detail = document.createElement("div");
            detail.className = "coverage-tooltip-detail text-small";
            detail.textContent = `Measured ${nearest[series.key].qualified}/${nearest.n} qualified; ${nearest[series.key].advisories} native advisories`;
            row.append(label, detail);
            tooltip.appendChild(row);
          });
          tooltip.hidden = false;
          const bounds = root.getBoundingClientRect();
          const desiredX = event.clientX - bounds.left + 12;
          const desiredY = event.clientY - bounds.top + 12;
          tooltip.style.left = `${Math.max(8, Math.min(desiredX, bounds.width - tooltip.offsetWidth - 8))}px`;
          tooltip.style.top = `${Math.max(8, Math.min(desiredY, bounds.height - tooltip.offsetHeight - 8))}px`;
          Object.assign(tooltipState, { panel: panel.key, x, clientX: event.clientX, clientY: event.clientY });
        }
        hit.on("pointermove", function(event) {
          if (!pinnedPanel) showAt(event, d3.pointer(event, svg.node())[0]);
        }).on("pointerleave", () => {
          if (!pinnedPanel) clearHover();
        }).on("pointerdown", function(event) {
          if (event.pointerType === "touch" || event.pointerType === "pen") {
            event.preventDefault();
            const wasPinned = pinnedPanel === panel.key;
            pinnedPanel = wasPinned ? null : panel.key;
            showAt(event, d3.pointer(event, svg.node())[0]);
          }
        });
        measureAndDeclutter(svg, width, height);
        if (tooltipState.panel === panel.key && pinnedPanel === panel.key) {
          showAt({ clientX: tooltipState.clientX, clientY: tooltipState.clientY }, xScale(tooltipState.x));
        }
      }

      function drawAll() {
        if (!pinnedPanel) clearHover();
        data.panels.forEach(drawPanel);
      }

      const observer = new ResizeObserver(() => {
        if (redrawQueued) return;
        redrawQueued = true;
        requestAnimationFrame(() => {
          redrawQueued = false;
          drawAll();
        });
      });
      root.querySelectorAll(".coverage-panel").forEach(panel => observer.observe(panel));
      drawAll();
    })();
  </script>
</div>
