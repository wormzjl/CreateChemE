// Optional local research tasks; not required to compile or test the mod.
sourceSets {
    // Benchmarks remain outside main and test source sets: they are runnable diagnostics,
    // never production dependencies and never timing assertions in CI.
    benchmark {
        java.srcDir 'benchmarks'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    // Offline neural MVP tooling is never part of the mod runtime artifact.
    neuralMvp {
        java.srcDir 'tools/neural'
        // The offline label checker is shared with regression tests.
        compileClasspath += sourceSets.test.output
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

